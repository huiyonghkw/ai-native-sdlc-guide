# agent-evals.yml
# 这是评测骨架，请按团队工具和风险等级改写。

version: 1
dataset:
  source: "近期被接受的真实任务"
  target_size: "20-50（起步范围，不是充分条件）"
  required_fields:
    - task
    - acceptance
    - environment
    - expected_artifacts

checks:
  - id: artifact-chain
    description: "是否留下 intent / spec / plan 及其关联记录"
  - id: verification
    description: "测试、构建或视觉验收是否能分辨对错"
  - id: policy
    description: "权限、敏感数据和不可违反规则是否满足"
  - id: review
    description: "是否形成独立评审与批准记录"

thresholds:
  minimum_pass_rate: 0.9
  max_regression_from_baseline: 0.05

on_failure:
  action: "停止升级自主权，保留失败样本并由负责人归因"
